{% extends "base.html" %}

{% block title %}Login — Status Window{% endblock %}

{% block content %}

    <h1>Login</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Log In</button>
    </form>

    <p><a href="{% url 'signup' %}">Don't have an account? Sign up</a></p>

{% endblock %}
