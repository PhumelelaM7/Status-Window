{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Status Window{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="app-shell">

        <!-- Account bar: shows login/logout depending on auth state -->
        <div class="account-bar">
            {% if user.is_authenticated %}
                <span>Logged in as {{ user.username }}</span>
                <form method="post" action="{% url 'logout' %}" class="logout-form">
                    {% csrf_token %}
                    <button type="submit" class="account-link-btn">Log out</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Log in</a>
            {% endif %}
        </div>
        
        {% block content %}
        {% endblock %}
    </div>

    <!-- Overdue quest modal: hidden by default, shown via JavaScript -->
    <div id="overdue-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <h2>Quest Overdue</h2>
            <p id="overdue-modal-message"></p>
            <div class="modal-buttons">
                <button id="overdue-reschedule-btn" class="modal-btn primary">
                    ↻ Reschedule
                </button>
                <button id="overdue-fail-btn" class="modal-btn">
                    ✗ Mark Failed
                </button>
            </div>
        </div>
    </div>

    <script src="{% static 'js/quest-watcher.js' %}"></script>
</body>
</html>
